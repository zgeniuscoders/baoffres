services:

  pgadmin:
    container_name: pg_admin
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=zgeniuscoders@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=Pgadmin@password-baoffres2026
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - app_network
    restart: unless-stopped

  db:
    container_name: baoffres_db
    image: postgres
    restart: unless-stopped
    networks:
      - app_network
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=baoffres
      - POSTGRES_PASSWORD=baoffres-2026@password_696
      - PGDATA=/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: redis
    image: redis:latest
    ports:
      - "6379:6379"
    command: redis-server
    restart: unless-stopped
    networks:
      - app_network
    volumes:
      - redis-data:/data

  nginx:
    container_name: nginx
    image: nginx:1.25
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
      - media_volume:/app/uploads
    networks:
      - app_network
    ports:
      - 80:80
    depends_on:
      - api
    restart: unless-stopped

  api:
    container_name: baoffres_app
    build: .
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/uploads
    env_file: .env
    networks:
      - app_network
    depends_on:
      - db

networks:
  app_network:
volumes:
  static_volume:
  media_volume:
  db-data:
  pgadmin:
  redis-data:
